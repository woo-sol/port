<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Woosol Lee</title>
<meta name="description" content="Woosol Lee — graphic design portfolio: signage, branding, space, editorial.">
<meta property="og:title" content="Woosol Lee">
<meta property="og:type" content="website">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link data-keep rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap">
<link data-keep rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Liter&display=swap">
<style id="css">
/* Layout: 상단 고정 헤더(이름 / Info) + 프로젝트가 세로로 쌓이는 스택. 각 프로젝트 = 구분선 → 텍스트 3단 → 높이를 맞춘 이미지 행 */
:root{
  --bg:#fbfbf9; --fg:#14161a; --muted:#6b7078; --rule:#14161a; --hair:#d9dad6;
  --ph-a:#e6e7e2; --ph-b:#d8dad4; --ph-c:#eeeeea; --accent:#1447c8;
  /* 영문·숫자: Liter / 한글: Noto Sans KR */
  --sans:"Liter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:var(--sans);
  --gutter:clamp(16px,2.4vw,36px); --gap:clamp(6px,.8vw,12px);
  --band:#0c0c0d; --band-fg:#f4f4f1; /* 상단 띠 색 */
  --map-bg:#0b0b0c; --map-fg:#f4f4f1; --map-line:#2a2b2e; --map-line2:#17181a; /* MAP 화면: 항상 검정 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101114; --fg:#ecece8; --muted:#9a9ea6; --rule:#ecece8; --hair:#2c2e33;
  --ph-a:#1d1f23; --ph-b:#26282d; --ph-c:#18191d; --accent:#8fb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101114; --fg:#ecece8; --muted:#9a9ea6; --rule:#ecece8; --hair:#2c2e33;
  --ph-a:#1d1f23; --ph-b:#26282d; --ph-c:#18191d; --accent:#8fb0ff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
p{margin:0}

.top,.project,.info,footer{padding-inline:var(--gutter)}
.top{transition:background-color .3s,color .3s,transform .25s}
body.barhide .top{transform:translateY(-100%)}
body::before{content:"";position:fixed;z-index:6;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--band);transition:background-color .3s;pointer-events:none}
html{background:var(--band)}
.top a:hover{color:inherit;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-fg);
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding-block:14px;font-size:1.0625rem;font-weight:500}
.top a[aria-current]{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}

.tabs{display:flex;gap:6px;align-items:center;min-width:0}
.genre{position:relative}
/* GENRE를 누르면 아래로 펼쳐지는 태그 목록 */
.menu{position:absolute;top:calc(100% + 8px);left:0;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.menu .pill{background:var(--band)}
/* 상단 탭: 둥근 라인(버블). 선택된 탭은 채워짐 */
.pill{border:1px solid currentColor;border-radius:999px;padding:1px 13px 2px;font:inherit;font-size:.9375rem;font-weight:400;line-height:1.5;
  letter-spacing:.02em;white-space:nowrap;background:none;color:inherit;cursor:pointer}
.top .pill:hover,.top .pill[aria-current],.top .pill[aria-expanded="true"]{background:var(--band-fg);color:var(--band);border-color:var(--band-fg);text-decoration:none}
.kind a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.empty{padding:clamp(40px,8vw,96px) var(--gutter);color:var(--muted)}
.right{display:flex;align-items:center;gap:6px;white-space:nowrap}
.label{font-family:var(--mono);font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ── 프로젝트 스택 ── */
/* 프로젝트마다 --pbg(배경) / --pfg(글자)를 받아 그 안의 보조색을 모두 여기서 파생 */
.project{background:var(--pbg);color:var(--pfg);padding-block:20px;
  --fg:var(--pfg);--accent:var(--pfg);
  --muted:color-mix(in srgb,var(--pfg) 68%,var(--pbg));
  --hair:color-mix(in srgb,var(--pfg) 24%,var(--pbg));
  --ph-a:color-mix(in srgb,var(--pfg) 10%,var(--pbg));
  --ph-b:color-mix(in srgb,var(--pfg) 17%,var(--pbg));
  --ph-c:color-mix(in srgb,var(--pfg) 6%,var(--pbg))}
.project a:hover{text-decoration:underline}
.project{position:relative}
/* 왼쪽 아래의 얇은 아래 화살표: 다음 프로젝트로 이동 */
.down{position:absolute;left:var(--gutter);bottom:20px;width:52px;height:64px;margin-left:-1px;padding:0;border:0;background:none;color:inherit;cursor:pointer;display:grid;place-items:center}
.down svg{width:50px;height:60px;fill:none;stroke:currentColor;stroke-width:1;vector-effect:non-scaling-stroke}
.text{padding-bottom:84px}
/* 위: 프로젝트 성격 한 줄 / 아래: 왼쪽 1/5 텍스트 + 오른쪽 4/5 이미지 */
.kind{display:block;text-align:center;font-size:.9375rem;line-height:1.2;margin-bottom:12px}
.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,4fr);gap:var(--gutter);align-items:start}
.text{display:flex;flex-direction:column;gap:20px}
.text .head{margin-bottom:16px}
.text h2{margin:0;font-size:clamp(1.5rem,2.1vw,1.9375rem);font-weight:400;line-height:1.25;letter-spacing:-.01em}
.text .year{margin-top:8px;font-family:var(--mono);font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.desc{max-width:62ch;font-size:.875rem;white-space:pre-wrap}
.meta{display:flex;flex-direction:column;gap:12px;margin:0;font-size:.875rem}
.meta dt{margin-bottom:1px}
.meta dd{margin:0}
.meta > div{position:relative}

.rows{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;gap:var(--gap)}
.ph{flex:var(--r) 1 0;min-width:0;max-width:100%;aspect-ratio:var(--r);margin:0;position:relative;overflow:hidden}
/* 장들은 같은 자리에 겹쳐 두고 한 장만 보임(옆 장이 가장자리에 비치지 않도록) */
.track{position:absolute;inset:0}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden;background:var(--ph-a)}
.slide.on{visibility:visible}
.slide:nth-child(even),.ph + .ph .slide:nth-child(odd){background:var(--ph-b)}
.ph + .ph .slide:nth-child(even){background:var(--ph-a)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .phl{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:.6875rem;letter-spacing:.06em;color:var(--muted)}
/* 여러 장이 든 칸: 양옆 화살표 + 장수 표시 */
.nav{position:absolute;top:0;bottom:0;width:56px;pointer-events:none;border:0;padding:0;cursor:pointer;background:none;
  color:var(--arrow,#fff);display:grid;place-items:center;opacity:0;transition:opacity .18s}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square}
.nav.prev{left:0}.nav.next{right:0}
.ph:hover .nav,.nav:focus-visible{opacity:1}
/* 마우스가 있는 기기: 슬라이드 위에서 커서 자체가 "2/5" 숫자로 바뀜 */
.ph.multi{cursor:pointer}
.count{display:none}   /* 장수는 마우스 커서 숫자로만 보여줌 */
@media (hover:hover){.ph.multi{cursor:none}}
#cur{position:fixed;left:0;top:0;z-index:10;pointer-events:none;transform:translate(-50%,-50%);color:#fff;
  font-size:1.0625rem;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.count{position:absolute;right:10px;bottom:8px;padding:2px 8px;border-radius:999px;background:var(--pbg);color:var(--pfg);
  font-size:.6875rem;letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* ── MAP: 검은 바탕 + 바둑판 그리드 + 가운데 십자 화살표 축, 좌표에 프로젝트 섬네일 ── */
#view-map{background:var(--map-bg);color:var(--map-fg)}
.map{position:relative;height:calc(100vh - var(--top-h,54px));height:calc(100svh - var(--top-h,54px));min-height:460px;overflow:hidden;
  /* 큰 격자 120px + 그 안을 10등분한 더 연한 격자 12px. 둘 다 한가운데에 선이 오도록 맞춤 */
  background-image:linear-gradient(var(--map-line) 1px,transparent 1px),linear-gradient(90deg,var(--map-line) 1px,transparent 1px),
    linear-gradient(var(--map-line2) 1px,transparent 1px),linear-gradient(90deg,var(--map-line2) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,12px 12px,12px 12px;
  background-position:calc(50% + 60px) calc(50% + 60px),calc(50% + 60px) calc(50% + 60px),calc(50% + 6px) calc(50% + 6px),calc(50% + 6px) calc(50% + 6px)}
/* 가운데에 2초마다 바뀌는 아무 프로젝트의 사진. 크기·비율·위치가 매번 다름. 축과 아이콘보다 아래에 깔림 */
.qw{position:absolute;transform:translate(-50%,-50%);width:42%;text-align:center;pointer-events:none;color:var(--map-fg);
  font-size:clamp(1.5rem,4.2vw,3.75rem);line-height:1.05;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
/* 축의 가운데와 화살표 끝 사이 한가운데(1/4 지점)를 지나는 더 연한 선. 네 낱말은 이 선들이 만나는 십자 위에 놓임 */
.map{--qx1:calc(25% + 14px);--qx2:calc(75% - 14px);--qy1:calc(25% + 22px);--qy2:calc(75% - 22px)}
.ql{position:absolute;background:color-mix(in srgb,var(--map-fg) 38%,transparent);pointer-events:none}
.ql.v{top:44px;bottom:44px;width:1px}.ql.v.a{left:var(--qx1)}.ql.v.b{left:var(--qx2)}
.ql.h{left:28px;right:28px;height:1px}.ql.h.a{top:var(--qy1)}.ql.h.b{top:var(--qy2)}
.qw.q1{left:var(--qx1);top:var(--qy1)}.qw.q2{left:var(--qx2);top:var(--qy1)}.qw.q3{left:var(--qx1);top:var(--qy2)}.qw.q4{left:var(--qx2);top:var(--qy2)}
.project.phid .lrow>*,.project.phid .kind,.project.phid .body{opacity:.3}
.pin.phid{opacity:.35}
.ax{position:absolute;background:var(--map-fg)}
.ax.x{left:28px;right:28px;top:50%;height:1px}
.ax.y{top:44px;bottom:44px;left:50%;width:1px}
.ax::before,.ax::after{content:"";position:absolute;width:9px;height:9px;border:solid var(--map-fg);border-width:1px 1px 0 0}
.ax.x::before{left:0;top:-4px;transform:rotate(-135deg)}
.ax.x::after{right:0;top:-4px;transform:rotate(45deg)}
.ax.y::before{top:0;left:-4px;transform:rotate(-45deg)}
.ax.y::after{bottom:0;left:-4px;transform:rotate(135deg)}
.axl{position:absolute;font-size:.75rem;letter-spacing:.16em;line-height:1}
.axl.up{top:18px;left:50%;transform:translateX(-50%)}
.axl.dn{bottom:18px;left:50%;transform:translateX(-50%)}
.axl.left{left:28px;top:calc(50% - 26px)}
.axl.right{right:28px;top:calc(50% - 26px)}
.pin,.pin:hover{color:var(--map-fg)}
.pin{position:absolute;transform:translate(-50%,-50%);width:clamp(22px,2.2vw,32px);z-index:1}
.pin:hover,.pin:focus-visible{z-index:3}
/* 프로젝트 = 그 프로젝트 배경색의 분류 아이콘. 어두운 색은 흰 테두리로 보이게 */
.ic{display:block;width:100%;height:auto;overflow:visible}
.ic .cut{fill:none;stroke:var(--map-bg);stroke-width:1.2}
.ic.ring :not(.cut){stroke:var(--map-fg);stroke-width:.8;paint-order:stroke}
.ic.ring .cut{stroke:var(--map-fg);stroke-width:.6}
.pin:hover .ic,.pin:focus-visible .ic{transform:scale(1.7)}
/* 설명: 커진 섬네일 옆에 뜸. 오른쪽에 있는 섬네일은 왼쪽으로 뜸 */
.pin .cap{display:none}
#mapcap{display:contents;color:var(--map-fg);font-size:.8125rem;line-height:1.4;text-align:left;pointer-events:none}
#mapcap .cimg{position:absolute;z-index:4;left:calc(50% + 14px);top:44px;width:min(320px,calc(50% - 42px));margin:0;pointer-events:none}
#mapcap .cy{position:absolute;z-index:4;left:28px;top:44px;font-size:clamp(1.5rem,4.2vw,3.75rem);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#mapcap .cm{position:absolute;z-index:4;left:28px;top:calc(50% + 14px);width:min(320px,calc(50% - 42px));display:flex;flex-direction:column;gap:3px}
#mapcap .cm>span{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:10px}
#mapcap .cm i{font-style:normal;opacity:.65}
#mapcap .ctxt{position:absolute;z-index:4;left:calc(50% + 14px);top:calc(50% + 14px);width:min(320px,calc(50% - 42px));display:flex;flex-direction:column;gap:4px;pointer-events:none}
.cap .cimg{display:block;position:relative;aspect-ratio:4/3;overflow:hidden;margin-bottom:4px}
.cap .cimg img{position:absolute;inset:0;width:100%;height:100%}
.cap b{font-size:.9375rem;font-weight:500}
.cap .sub{opacity:.65}
.cap .line{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}

/* ── Info ── */
/* 엔딩 크레딧식: 검은 바탕, 3등분 컬럼, 왼쪽 정렬, 소분류는 들여쓰기 */
#view-info{background:var(--map-bg);color:var(--map-fg);--fg:var(--map-fg);--bg:var(--map-bg);min-height:calc(100vh - var(--top-h,54px))}
.info{padding-block:clamp(28px,4vw,56px) clamp(56px,9vw,120px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px var(--gutter);
  font-size:clamp(1rem,1.3vw,1.25rem);line-height:1.35}
.cr{display:flex;flex-direction:column;gap:1.15em;--in:clamp(20px,3.4vw,52px);min-width:0}
.b{display:flex;flex-direction:column;align-items:flex-start}
.b.l1{padding-left:var(--in)}
.b.l2{padding-left:calc(var(--in)*2)}
.b h3{margin:0;font:inherit;font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.b.l1 h3::before{content:"—"}
.b p{max-width:30em;white-space:pre-wrap}
.addr{user-select:all;overflow-wrap:anywhere}
.copy{font:inherit;font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;
  background:none;color:var(--fg);border:1px solid var(--fg);padding:5px 10px;cursor:pointer;margin-top:8px}
.copy:hover{background:var(--fg);color:var(--bg)}

footer{border-top:1px solid var(--hair);padding-block:14px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ── 태블릿 ── */
@media (max-width:1000px){
  .body{grid-template-columns:minmax(0,3fr) minmax(0,7fr)}
}
/* ── 모바일: 텍스트 1단, 이미지 칸은 한 줄에 하나씩 ── */
@media (max-width:760px){.info{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .body{grid-template-columns:minmax(0,1fr);gap:24px}
  .text{padding-bottom:0}
  .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
  .meta dd{overflow-wrap:anywhere}
  .project{padding-bottom:96px}
  .top{flex-wrap:wrap;gap:8px}
  .pill{padding:1px 9px 2px;font-size:.8125rem}
  .row{flex-direction:column}
  .row .ph{flex:none;width:100%}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

/* ── Vimeo 칸: 새 탭으로 여는 카드 ── */
.vid{position:absolute;inset:0;display:grid;place-items:center;background:var(--ed-bg);color:var(--ed-fg)}
.vid:hover{color:var(--ed-fg)}
.vid .play{width:0;height:0;border-style:solid;border-width:16px 0 16px 26px;border-color:transparent transparent transparent currentColor}
.vid .vl{position:absolute;left:10px;bottom:8px;font-size:.75rem;letter-spacing:.06em}

/* ── 암호 입력(이름 세 번 클릭) ── */
.home{position:relative;display:inline-flex;align-items:center;min-height:1.6em}
.lockbox{position:relative;display:inline-flex;align-items:center}
.dots{display:inline-flex;gap:9px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;border:1px solid currentColor}
.dots i.on{background:currentColor}
#pin-in{position:absolute;inset:-6px;width:calc(100% + 12px);opacity:0;border:0;padding:0;font-size:16px}

/* ── 편집 모드 ── */
:root{--ed-bg:#111214;--ed-fg:#f4f4f1;--ed-warn:#ffb4a6}
body.editing{padding-bottom:72px}
body.editing [contenteditable]{outline:1px dashed color-mix(in srgb,currentColor 50%,transparent);outline-offset:3px;min-width:2em;min-height:1.3em;cursor:text}
body.editing [contenteditable]:focus{outline-style:solid}
body.editing .ph.multi{cursor:default}
body.editing .slide img{cursor:grab;touch-action:none}
.eb{font:500 12px/1.2 system-ui,sans-serif;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--ed-bg);border-radius:5px;
  background:var(--ed-bg);color:var(--ed-fg);cursor:pointer;white-space:nowrap}
.eb:hover{background:var(--ed-fg);color:var(--ed-bg)}
.eb.warn{border-color:var(--ed-warn);color:var(--ed-warn)}
.eb.x{padding:2px 7px;position:absolute;right:0;top:0}
select.eb{appearance:auto}
.eb input[type=color]{width:22px;height:18px;padding:0;border:0;background:none}
.eb.zoom input{width:84px}
.stools .eb{border-color:color-mix(in srgb,var(--ed-fg) 35%,var(--ed-bg))}
.text > .eb{align-self:flex-start}
.stools{position:absolute;left:8px;right:8px;top:8px;z-index:2;display:flex;flex-wrap:wrap;gap:4px}
.vimeo-in{font:13px system-ui,sans-serif;padding:5px 8px;border:1px solid var(--ed-bg);border-radius:5px;background:var(--ed-fg);color:var(--ed-bg);width:min(240px,100%)}
.ptools,.rtools{display:flex;flex-wrap:wrap;gap:6px}
.ptools{justify-content:flex-end;margin-bottom:12px}
.rtools{justify-content:flex-end}
.kind .chip{font:inherit;color:inherit;background:none;border:1px solid currentColor;border-radius:999px;padding:1px 11px 2px;margin:0 2px 4px;cursor:pointer;opacity:.55}
.kind .chip[aria-pressed="true"]{opacity:1;background:var(--pfg);color:var(--pbg)}
.btools{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cr > .eb{align-self:flex-start}
body.editing .pin{cursor:move;touch-action:none}
#edbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px var(--gutter) calc(10px + env(safe-area-inset-bottom,0px));background:var(--ed-bg);color:var(--ed-fg);font:13px/1.3 system-ui,sans-serif}
#edbar .eb{border-color:var(--ed-fg)}
#edbar .st{flex:1 1 160px;min-width:0;opacity:.8}

/* 행 사이 막대: 끌어서 위아래 사진 높이 비율 조정 */
.row{position:relative}
.row > .rtools{position:absolute;right:8px;bottom:8px;z-index:2}
.rsize{position:absolute;left:50%;bottom:calc(var(--gap) / -2 - 9px);transform:translateX(-50%);z-index:3;width:120px;height:18px;display:grid;place-items:center;cursor:ns-resize;touch-action:none}
.rsize i{width:72px;height:6px;border-radius:3px;background:var(--pfg);border:1px solid var(--pbg);opacity:.8}
.rsize:hover i{opacity:1}
body.picking .slide img{cursor:crosshair}
@media (max-width:640px){.rsize{display:none}}

/* ── LIST 보기: 프로젝트마다 그 프로젝트 색의 띠 한 줄(제목 · 연도 · 성격 · 분류). 누르면 그 자리에서 펼쳐짐 ── */
.top .pill[aria-pressed="true"]{background:var(--band-fg);color:var(--band);border-color:var(--band-fg)}
.lrow{display:none}
body.listing .project{padding-block:0}
body.listing .lrow{display:grid;grid-template-columns:minmax(0,8fr) 5em minmax(0,3fr);gap:var(--gutter);align-items:baseline;width:100%;
  padding:13px 0 14px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
body.listing .lrow .lt{font-size:clamp(1.0625rem,1.5vw,1.375rem);line-height:1.25}
body.listing .lrow .ly,body.listing .lrow .lc{font-size:clamp(1.0625rem,1.5vw,1.375rem);line-height:1.25;font-variant-numeric:tabular-nums}
/* LIST 에서 펼치면 띠의 제목이 본문 제목 크기로 커지고, 아래에 겹쳐 나오던 제목·연도는 숨김 (편집 중엔 고칠 수 있게 그대로 둠) */
body.listing:not(.editing) .project.open .lrow .lt{font-size:clamp(1.5rem,2.1vw,1.9375rem);letter-spacing:-.01em}
body.listing:not(.editing) .project.open .head{display:none}
body.listing .lrow:hover .lt{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
body.listing .project:not(.open) > :not(.lrow){display:none}
body.listing .project.open{padding-bottom:20px}
.lk{display:inline-block;width:.8em;height:.8em;margin-left:.45em;vertical-align:-.04em;fill:none;stroke:currentColor;stroke-width:1.3}
.project.locked .lrow{cursor:default}
body.listing .project.locked .lrow:hover .lt{text-decoration:none}
body.listing .project.open > .kind,body.listing .project > .down{display:none}
body.listing .project.open .text{padding-bottom:0}
body.listing.editing .project.open > .kind{display:block;margin-top:4px}
@media (max-width:640px){
  body.listing .lrow{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
  body.listing .lrow .lc{grid-column:1/-1}
}

/* 파일을 끌어 올린 칸 표시 */
.ph.drop{outline:3px dashed var(--pfg);outline-offset:-6px}
.ph.drop .track{opacity:.55}
/* PT 보기: A4 가로 쪽을 화면에 한 장씩 맞춰 세로로 늘어놓음 */
#pt{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#1b1c1f;color:var(--ed-fg);font:13px/1.3 system-ui,sans-serif}

.ptbar .st{flex:1 1 120px;min-width:0;opacity:.8}
.ptbar .eb{border-color:var(--ed-fg)}
.ptlist{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ptp{flex:none;display:block;width:min(100%,calc((100vh - 96px) * 297 / 210));height:auto;box-shadow:0 2px 24px rgba(0,0,0,.45)}
.ptp text{font-family:var(--sans);font-weight:400}
.pttools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px var(--gutter);background:#26272b;border-top:1px solid #3a3b40}
.pttools>b{font-weight:500;margin-right:6px;max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pttools .eb{border-color:#6b6d74}
.pttools .eb[aria-pressed="true"]{background:var(--ed-fg);color:var(--ed-bg)}
.pttools .grp{display:inline-flex;gap:2px}
.ptpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-basis:100%;max-height:min(212px,32vh);overflow-y:auto;padding-top:4px}
.ptpick .pthd,.ptpick .ptgt{flex-basis:100%;display:flex;gap:8px;align-items:center;opacity:.85}
.ptpick .ptgt{opacity:.6;font-size:11px;margin-top:4px}
.ptpick button.used{opacity:.45}
.ptpick button[data-pt="pick"]{flex:none;padding:0;border:1px solid #6b6d74;background:none;cursor:pointer;line-height:0}
.ptpick img{height:56px;width:auto;display:block}
.ptt{cursor:grab}
.ptt.sel .ptselr{stroke:#3b9eff;stroke-width:.7}
.pth{fill:transparent}.pth.r{cursor:ew-resize}.pth.b{cursor:ns-resize}
.pth:hover{fill:rgba(59,158,255,.55)}
#pt-prog{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#pt-prog .card{width:min(440px,calc(100% - 40px));padding:22px 24px;background:var(--ed-bg);border:1px solid #4a4b51;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
#pt-prog p{margin:0;font-size:15px;line-height:1.45}
#pt-prog .bar{align-self:stretch;height:4px;background:#3a3b40}#pt-prog .bar i{display:block;height:100%;background:var(--ed-fg);transition:width .2s}
#pt-prog .eb{border-color:var(--ed-fg);text-decoration:none}

"Project manager"}],"rows":[[{"r":1.603,"items":[{"src":"img/pf-hangang-05.jpg","x":50.19705570866324,"y":47.98087132807144,"z":1},{"src":"img/mv2bvqjloozi0x.jpg","x":51.60819669587117,"y":50.498827725133644,"z":1},{"src":"img/mv2bvqjlf1rnm1.jpg","x":55.41619103195821,"y":42.343780540431844,"z":1.1}]}],[{"r":1.192,"items":[{"src":"img/pf-hangang-01.jpg","x":50,"y":50,"z":1},{"src":"img/mv0tbbjb9odq46.jpg","x":50,"y":50,"z":1}]},{"r":1.192,"items":[{"src":"img/mv2bvqjlliszoe.jpg","x":48.743520659307876,"y":49.34603252108135,"z":1.03},{"src":"img/mv2bvqjlom5nj2.jpg","x":51.14495543705251,"y":50.43393089657738,"z":1},{"src":"img/mv2bvqjlpq2kar.jpg","x":50,"y":50,"z":1}]}]],"bg":"#e6e6e6","fg":"#14161a","hide":true},{"title":"Gangdong Central Library","year":"2025","tags":["signage"],"map":[0.74,0.67],"desc":{"ko":"강동중앙도서관은 강동구에 새롭게 조성된 4층 규모의 시민 도서관으로 장서 수가 12만 권에 달한다. 이 규모의 장서를 효율적으로 찾기 위한 사이니지 시스템을 디자인했다. 즉흥적으로 길을 찾는 이용객보다 도서의 위치를 알고 목적지로 향하는 이용객을 타겟으로, 서가의 분류보다 숫자와 체계를 강조했다.\n\n사이니지는 서가와 대비되는 블랙 컬러로 적용하고 서가번호 레이아웃을 구분하는 가로 라인을 강조했다. 이 라인 그래픽은 쌓여 있는 책을 은유하는 그래픽으로 확장되어 간판과 홍보물에 적용되었다. 서가분류판의 하부는 자석판과 종이로 제작해 그때그때 교체할 수 있게 만들었다. ","en":"Gangdong Central Library is a new four-storey public library in Gangdong-gu holding around 120,000 volumes. We designed a signage system that makes a collection of this size easy to search. The system targets visitors who already know where their book is rather than those browsing, so it stresses numbers and structure over shelf categories.\n\nThe signs are black to contrast with the shelves, with horizontal lines that separate the shelf-number layout. The line graphic extends into a metaphor of stacked books and is applied to the signboard and promotional material. The lower part of each shelf panel is made of magnet board and paper so it can be replaced whenever books move."},"meta":[{"k":"Category","ko":"Signage","en":"Signage"},{"k":"Duration","ko":"3개월","en":"3 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"강동문화재단","en":"Gangdong Cultural Foundation"},{"k":"ROLE","ko":"Project manager","en":"Project manager"}],"rows":[[{"r":1.78,"items":[{"src":"img/mv2c3vyb1s0z6s.jpg","x":50.16108099019752,"y":55.520847865513396,"z":1.21},{"src":"img/mv2c3vybxsxg7z.jpg","x":49.460731362396814,"y":66.89327464384192,"z":1},{"src":"img/mv2c3vybwbrmv2.jpg","x":49.46029950987618,"y":52.44813806870405,"z":1},{"src":"img/mv2c3vyb95nrmc.jpg","x":47.75923243108786,"y":27.289228679753144,"z":1}]}],[{"r":1,"items":[{"src":"img/mv2c3vybwndafn.jpg","x":31.34751058136933,"y":49.71795639730012,"z":1}]},{"r":1,"items":[{"src":"img/mv2c3vyb1iyxj9.jpg","x":50,"y":50,"z":1}]}]],"bg":"#bcbbba","fg":"#14161a","pt":[{"src":"img/mv2c3vybxsxg7z.jpg","r":1.9185,"br":2,"x":49.5,"y":53.8,"z":1,"pw":0.9999841095141616},{"src":"img/mv2c3vybwndafn.jpg","r":1.6075,"br":1,"x":0.9,"y":8.7,"z":1.19},{"src":"img/mv2c3vyb1iyxj9.jpg","r":1.6075,"br":0,"x":50,"y":46.9,"z":1},{"src":"img/mv2c3vyb1s0z6s.jpg","r":1.8674,"br":2,"x":50.16108099019752,"y":55.520847865513396,"z":1.1,"pw":0.9999903046980088},{"src":"img/mv2c3vyb95nrmc.jpg","r":1.6856,"br":1,"x":47.8,"y":25.2,"z":1},{"src":"img/mv2c3vybwbrmv2.jpg","r":1.6856,"br":0,"x":42.6,"y":38.7,"z":1.48}],"pto":4},{"title":"Child Healing Center","year":"2025","tags":["signage","branding"],"map":[0.64,0.21],"desc":{"ko":"아동힐링센터는 외상 경험으로 심리적, 신체적 어려움이 있는 아이들이 3개월가량 머무르며 트라우마 기반 치료를 받고 학교로 돌아갈 수 있도록 돕는 시설이다. 서울에서 유일하게 치유와 회복을 위해 조성된 교육시설로서, 2025년 개관을 위한 사이니지를 디자인하였다.\n\n밝고 따뜻한 색채로 각 층의 사이니지 색상을 지정하고, 좁은 복도형 공간의 특성에 따라 벽면 부착형과 돌출형 사이니지를 절곡을 통해 하나로 통합하였다.","en":"The Child Healing Center helps children with psychological and physical difficulties after traumatic experiences. They stay for about three months, receive trauma-based treatment and return to school. As the only educational facility in Seoul built for healing and recovery, it needed signage for its 2025 opening.\n\nBright, warm colours identify each floor, and because the corridors are narrow, wall-mounted and projecting signs are combined into a single folded sign."},"meta":[{"k":"Category","ko":"Signage, Branding","en":"Signage, Branding"},{"k":"Duration","ko":"6개월","en":"6 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"서울특별시","en":"Seoul Metropolitan City"},{"k":"ROLE","ko":"Project manager","en":"Project manager"}],"rows":[[{"r":1.78,"items":[{"src":"img/mv2c3vyb0u63ce.jpg","x":61.333000077310274,"y":49.3860540089863,"z":1},{"src":"img/mv2c3vybv1skqc.jpg","x":48.48966778449292,"y":62.29267280642726,"z":1}]}],[{"r":1,"items":[{"src":"img/mv2c3vybambqgy.jpg","x":53.3260227103222,"y":39.7423646330549,"z":1.5}]},{"r":1,"items":[{"src":"img/mv2c3vyb55vsea.jpg","x":46.99899313842482,"y":50.598960275581746,"z":1.3}]}]],"bg":"#00c2a2","fg":"#14161a","pt":[{"src":"img/mv2c3vybv1skqc.jpg","r":1.2053,"br":2,"x":59,"y":31.8,"z":1,"pw":0.9999816858402584},{"src":"img/mv2c3vyb0u63ce.jpg","r":1.2053,"br":0,"x":60,"y":49.4,"z":1},{"src":"img/mv2c3vybambqgy.jpg","r":1.1802,"br":1,"x":53.1,"y":42.1,"z":1.5},{"src":"img/mv2c3vyb55vsea.jpg","r":1.1802,"br":0,"x":39.7,"y":57.1,"z":1.3}],"pto":9},{"title":"Carehome Branding","year":"2025","tags":["branding"],"map":[-0.19,0.67],"desc":{"ko":"케어홈은 노인 간병 및 방문형 재활 서비스를 제공하는 스타트업 케어닥이 자체적으로 운영하는 요양 서비스 시설이다. \n\n심볼로고는 홈의 첫 글자 ‘H’를 형상화하면서 활력과 생명력을 의미하는 불꽃의 형상을 결합한다. 딥그린과 샴페인 골드의 컬러가 어우러져 고급 타겟을 포지셔닝 한다. ","en":"Carehome is a care facility run by Caredoc, a startup providing elderly care and home-visit rehabilitation.\n\nThe symbol shapes the letter H of ‘home’ and combines it with a flame standing for vitality. Deep green paired with champagne gold positions the brand for a premium audience."},"meta":[{"k":"Category","ko":"Branding, Logo design","en":"Branding, Logo design"},{"k":"Duration","ko":"8개월","en":"8 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"케어닥","en":"Caredoc"},{"k":"ROLE","ko":"Project manager","en":"Project manager"}],"rows":[[{"r":1.724,"items":[{"src":"img/mv0tjrzpilabjn.jpg","x":49.191054724212876,"y":36.64364807029984,"z":1},{"src":"img/mv0tjrzp5tf8j8.jpg","x":50.068767805744834,"y":53.11456368073845,"z":1}]}],[{"r":1.438,"items":[{"src":"img/mv0tjrzpxha7le.jpg","x":19.064713974869296,"y":43.401866141564206,"z":1}]},{"r":1.438,"items":[{"src":"img/pf-carehome-02.jpg","x":50.589425223214285,"y":40.46757460681632,"z":1},{"src":"img/mv0tjrzpych528.jpg","x":50,"y":50,"z":1},{"src":"img/mv0tjrzp9xbjmy.jpg","x":49.85931744593631,"y":53.15516737640881,"z":1},{"src":"img/mv0tjrzprlseyx.jpg","x":50,"y":50,"z":1}]}]],"bg":"#f2efe3","fg":"#14161a","pt":[{"src":"img/mv0tjrzp5tf8j8.jpg","r":1.9207,"br":2,"x":50.068767805744834,"y":53.11456368073845,"z":1,"pw":1},{"src":"img/mv0tjrzpxha7le.jpg","r":1.0569,"br":1,"x":71.5,"y":43.4,"z":1},{"src":"img/pf-carehome-02.jpg","r":1.0569,"br":0,"x":50.6,"y":36.8,"z":1},{"src":"img/mv0tjrzpych528.jpg","r":1.0569,"br":0,"x":33.8,"y":50,"z":1}],"pto":10},{"title":"Seonjeongneung Heritage Street Branding","year":"2024","tags":["branding","signage"],"map":[-0.2,1.07],"desc":{"ko":"선정릉 역사문화거리 프로젝트는 유네스코 세계문화유산인 선정릉의 가치를 담장 안에 가두지 않고, 우리가 걷는 도심의 가로 위로 확장하는 시도다. \n\n500년의 시간을 품은 유산의 원형을 현대적으로 재해석, 재생산하여 과거와 현재가 공존하고 미래 세대에게 그 가치가 이어지는 지속가능한 도시의 정체성을 구축한다.","en":"The Seonjeongneung Heritage Street project tries to extend the value of Seonjeongneung, a UNESCO World Heritage site, beyond its walls and onto the city streets we walk.\n\nIt reinterprets and reproduces the original forms of a 500-year-old heritage in a contemporary way, building a sustainable urban identity where past and present coexist and the value is passed on to future generations."},"meta":[{"k":"Category","ko":"Branding, Signage, Logo design","en":"Branding, Signage, Logo design"},{"k":"Duration","ko":"8개월","en":"8 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"서울특별시","en":"Seoul Metropolitan City"},{"k":"ROLE","ko":"Graphic designer","en":"Graphic designer"}],"bg":"#b13541","fg":"#f4ece3","rows":[[{"r":1.757,"items":[{"src":"img/mv0tnkqotiqapo.jp e"],"map":[0.83,-0.26],"desc":{"ko":"동작구에 위치한 가족센터의 건물 리모델링과 함께 진행된 사이니지 개선 프로젝트. 가족센터 로고가 가진 박공지붕 형태에서 모티브를 가져와 사이니지의 형태를 잡고, 층별 컬러를 선정하여 사이니지의 측면에 부분적으로 적용하였다.","en":"A signage improvement project carried out alongside the remodelling of the family center in Dongjak-gu. The shape of the signs takes its motif from the gable roof in the center's logo, and a colour chosen for each floor is applied partially to the sides of the signs."},"meta":[{"k":"Category","ko":"Signage","en":"Signage"},{"k":"Duration","ko":"4개월","en":"4 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"동작구 가족센터","en":"Dongjak-gu Family Center"},{"k":"ROLE","ko":"Project manager","en":"Project manager"}],"rows":[[{"r":1.76,"items":[{"src":"img/mv0ts3yto3b72s.jpg","x":49.65317805010573,"y":52.43731033703512,"z":1}]}],[{"r":0.949,"items":[{"src":"img/pf-dongjak-01.jpg","x":44.48193452204135,"y":45.45866545256194,"z":1}]},{"r":0.949,"items":[{"src":"img/pf-dongjak-04.jpg","x":50,"y":50,"z":1},{"src":"img/mv0ts3ytdjg2om.jpg","x":50.838525576283274,"y":52.313309403153156,"z":1.83}]}]],"bg":"#bee359","fg":"#14161a","pt":[{"src":"img/mv0ts3yto3b72s.jpg","r":2.024,"br":2,"x":49.7,"y":56,"z":1,"pw":0.9999655259317611},{"src":"img/pf-dongjak-01.jpg","r":1.4593,"br":1,"x":44.48193452204135,"y":45.45866545256194,"z":1},{"src":"img/pf-dongjak-04.jpg","r":0.7318,"br":0,"x":50,"y":50,"z":1},{"src":"img/mv0ts3ytdjg2om.jpg","r":1.5332,"br":0,"x":50.838525576283274,"y":52.313309403153156,"z":1.83}],"pto":8},{"title":"Ttukseom Fit Station","year":"2024","tags":["space"],"map":[1,0.3],"desc":{"ko":"서울시 펀스테이션 사업의 일환으로 뚝섬역 공간을 운동시설과 함께 ‘Fit Station’이라는 네이밍으로 개선하는 그래픽 작업을 진행했다. \n\n기둥과 벽면에 방염시트가 적용되었으며 민간위탁운영기관과의 협력으로 진행되었다.","en":"As part of Seoul's Fun Station programme, graphics were designed to improve Ttukseom Station together with its exercise facilities under the name ‘Fit Station’.\n\nFlame-retardant sheets were applied to the columns and walls, and the work was carried out with the private operator of the space."},"meta":[{"k":"Category","ko":"Space Graphic","en":"Space Graphic"},{"k":"Duration","ko":"4개월","en":"4 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"서울특별시","en":"Seoul Metropolitan City"},{"k":"ROLE","ko":"Graphic designer","en":"Graphic designer"}],"rows":[[{"r":1.581,"items":[{"src":"img/pf-ttukseom-02.jpg","x":51.326672903660615,"y":80.65879924414938,"z":1},{"src":"img/pf-ttukseom-06.jpg","x":50.58335337817466,"y":53.81280873388453,"z":1},{"src":"img/pf-ttukseom-07.jpg","x":51.601705215575336,"y":94.58427121286437,"z":1},{"src":"img/pf-ttukseom-08.jpg","x":49.50923854728292,"y":66.19934355731502,"z":1}]}],[{"r":0.935,"items":[{"src":"img/pf-ttukseom-01.jpg","x":50,"y":50,"z":1}]},{"r":0.935,"items":[{"src":"img/pf-ttukseom-03.jpg","x":50,"y":50,"z":1}]}],[{"r":1.33,"items":[{"src":"img/pf-ttukseom-04.jpg","x":50,"y":50,"z":1}]},{"r":1.33,"items":[{"src":"img/pf-ttukseom-05.jpg","x":50,"y":50,"z":1}]}]],"bg":"#25b3b1","fg":"#f4f1ea","hide":true},{"title":"Sangsang Campus Signage","year":"2024","tags":["signage"],"map":[0.42,0.53],"desc":{"ko":"경기상상캠퍼스 부지 내의 명확한 정보 전달과 공간 분위기 개선을 목적으로 하는 방향 안내 사이니지 디자인 과업을 수행했다. 과거 서울대학교 농업생명과학대학 부지였던 이곳은 경기문화재단이 복합문화공간으로 운영하고 있으나, 인도와 차도가 제대로 구분되지 않고 주차와 각 공간에 대한 안내 시스템도 정립되지 않아 혼란이 있었다.\n\n기존 로고의 두꺼운 초성 이미지를 바탕으로 화살표와 간판의 디자인 어휘를 정했다. 녹색 풍경과 적당히 대비를 이루는 청록색을 방향 안내에, 분홍색을 주의 안내에 적용하였다.","en":"A wayfinding signage project for Gyeonggi Sangsang Campus, aiming at clear information and a better atmosphere across the site. Formerly the grounds of Seoul National University's College of Agriculture and Life Sciences, it is now run as a cultural complex by the Gyeonggi Cultural Foundation, but pavements and roads were poorly separated and guidance to parking and buildings had never been organised.\n\nThe arrows and sign vocabulary build on the thick initial consonants of the existing logo. A teal that contrasts moderately with the green landscape is used for directions, and pink for caution signs."},"meta":[{"k":"Category","ko":"Signage","en":"Signage"},{"k":"Duration","ko":"4개월","en":"4 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"경기문화재단","en":"Gyeonggi Cultural Foundation"},{"k":"ROLE","ko":"Graphic designer","en":"Graphic designer"}],"rows":[[{"r":1.5,"items":[{"src":"img/mv0ttr076s58my.jpg","x":50.340046240309576,"y":51.66148142246621,"z":1},{"src":"img/mv0ttr07ptf3gg.jpg","x":49.63802567848656,"y":68.83523124310699,"z":1},{"src":"img/mv0ttr07t2sqqo.jpg","x":50,"y":50,"z":1},{"src":"img/mv0ttr07roqzfl.jpg","x":50,"y":50,"z":1},{"src":"img/mvgl24s1m6xm7h.jpg","x":51.276905941926685,"y":47.73947880185883,"z":1.26}]}],[{"r":1,"items":[{"src":"img/pf-sangsang-01.jpg","x":50.04473687955373,"y":49.999444124260016,"z":1}]},{"r":1,"items":[{"src":"img/mvgl24s1j7beu7.jpg","x":48.2519984061051,"y":57.193875202255605,"z":1}]}]],"bg":"#00ddd3","fg":"#14161a","pt":[{"src":"img/mv0ttr076s58my.jpg","r":1.9429,"br":2,"x":50.3,"y":64.8,"z":1,"pw":1},{"src":"img/pf-sangsang-01.jpg","r":1.0369,"br":1,"x":70.1,"y":50,"z":1},{"src":"img/pf-sangsang-02.jpg","r":1.0369,"br":0,"x":50,"y":67.4,"z":1},{"src":"img/mv0ttr07ptf3gg.jpg","r":1.0369,"br":0,"x":47.1,"y":63.1,"z":1},{"src":"img/mv0ttr07cco61p.jpg","r":1.163,"br":2,"x":56.2,"y":50,"z":1,"pw":1},{"src":"img/mv0ttr07t2sqqo.jpg","r":1.163,"br":0,"x":36.6,"y":50,"z":1}],"pto":7},{"title":"Global Youth Center Signage","year":"2024","tags":["signage","branding"],"map":[0.51,-0.57],"desc":{"ko":"화성시에 위치한 이주청소년을 위한 교육시설 화성시글로벌청소년센터의 브랜딩과 공간 사이니지 디자인 프로젝트. ‘지구별화성’은 별과 같은 아이들이 화성시에 이주해 함께한다는 의미로 지어진 센터의 새로운 이름이다. 아이들이 낯선 환경에서 환영받을 수 있도록 밝은 컬러와 친근한 네이밍으로 심볼, 브랜드 요소, 환경 그래픽을 진행했다.\n\n심볼은 청소년을 의미하는 반짝이는 별과 커뮤니티로서의 ‘지구별’을 상징하는 커다란 원으로 구성되었다. 사이니지는 녹색과 오렌지 컬러를 중심으로 블럭 형상이 조합되는 어휘를 전개하며, 사각형을 컨셉으로 한 휴식공간 ‘스퀘어존’과 일관되도록 각진 디테일로 구성되었다.","en":"Branding and spatial signage for the Hwaseong Global Youth Center, an educational facility for migrant youth in Hwaseong. Its new name, ‘Jigubyeol Hwaseong’, means that children like stars have moved to Hwaseong to be together. Bright colours and a friendly name welcome children in an unfamiliar environment, across the symbol, brand elements and environmental graphics.\n\nThe symbol combines a twinkling star for the young users with a large circle for the community as a ‘planet’. The signage uses green and orange in a vocabulary of combined blocks, with angular details that stay consistent with the ‘Square Zone’, a rest area planned around the square."},"meta":[{"k":"Category","ko":"Signage","en":"Signage"},{"k":"Duration","ko":"4개월","en":"4 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"화성시","en":"Hwaseong City"},{"k":"ROLE","ko":"Graphic designer","en":"Graphic designer"}],"rows":[[{"r":1.78,"items":[{"src":"img/mv328f5xlaxbwz.jpg","x":49.572297568633175,"y":46.734375811098424,"z":1}]}],[{"r":1.33,"items":[{"src":"img/mv0ty2mt3uj9b5.jpg","x":47.25352850313793,"y":34.79046445904356,"z":1}]},{"r":1.33,"items":[{"src":"img/pf-globalyouth-02.jpg","x":50,"y":50,"z":1}]}]],"bg":"#55a58d","fg":"#f4f1ea","hide":true},{"title":"Wheelchair Ramp Sticker","year":"2024","tags":["signage"],"map":[0.03,-0.46],"desc":{"ko":"서울시 주도로 상점에 보급되는 휠체어용 경사로가 적용된 상점에 부착되는 스티커의 그래픽 디자인 작업을 진행했다. 기울어진 사선으로 경사로 자체의 시각적 이미지를 강조하는 아이디어를 제안하였고, 피드백을 반영하여 경사로를 사용하는 주체를 나눈 뒤 네 가지의 다른 픽토그램이 공존하는 형상으로 결정되었다.","en":"Graphic design for the sticker attached to shops fitted with wheelchair ramps supplied by the Seoul city government. The first proposal stressed the image of the ramp itself with a slanted line. After feedback, the users of the ramp were divided into groups and the final design shows four different pictograms side by side."},"meta":[{"k":"Category","ko":"Graphic Design","en":"Graphic Design"},{"k":"Duration","ko":"2개월","en":"2 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"서울특별시","en":"Seoul Metropolitan City"},{"k":"ROLE","ko":"Graphic designer","en":"Graphic designer"}],"rows":[[{"r":1.475,"items":[{"src":"img/pf-wheelchair-01.jpg","x":50,"y":50,"z":1},{"src":"img/mv2cohznf5uyxn.jpg","x":57.310552135620384,"y":52.66123535747988,"z":1.29},{"src":"img/mv2g220p10ppt8.jpg","x":50,"y":50,"z":1.28}]}]],"bg":"#d63d7a","fg":"#ffffff","pt":[{"src":"img/mv2cohznf5uyxn.jpg","r":1.1899,"br":2,"x":55.2,"y":52.2,"z":1,"pw":1}],"pto":6},{"title":"Dongtan Tram Branding","year":"2024","tags":["branding"],"map":[0.2,0.82],"desc":{"ko":"동탄트램 마스터플래닝 디자인 프로젝트 중 시민과의 커뮤니케이션을 담당하는 브랜딩 부분을 진행했다. 동탄은 차량, 정거장, 브랜드 디자인을 하나의 디자인 주체가 통합적으로 관리하도록 과업을 마련하였다. 브랜드의 톤앤매너는 시민친화적이면서도 안전, 친환경, 교통의 역할을 충실히 실현하는 믿음직한 인상으로 구축했고, 슬로건은 ‘ALL NEW WAY’로 설정했다.\n\n로고는 동탄 1, 2 신도시의 형상에서 가져온 반원, 새로운 길과 연결을 의미하는 직선, 자족형 순환도시를 나타내는 원을 그래픽 요소로 사용한다. 초성 ‘ㄷㅌㅌㄹ’을 의미하면서 가로로 길게 뻗은 형태는 나아가는 트램을 상징하며, 캡슐 형태의 라인은 픽토그램, 전조등, 안내판과 노선 체계로 확장된다.","en":"The branding part of the Dongtan Tram master-planning project, in charge of communication with citizens. Dongtan set up the commission so that one design team manages vehicle, stop and brand design together. The tone is citizen-friendly yet trustworthy, standing for safety, sustainability and transport, and the slogan is ‘ALL NEW WAY’.\n\nThe logo uses a half circle taken from the shape of Dongtan new towns 1 and 2, a straight line for a new route and connection, and a circle for a self-sufficient circular city. Its long horizontal form reads as the initial consonants of ‘Dongtan Tram’ in Hangul and as a tram moving forward, and its capsule-shaped line extends into pictograms, headlights, signs and the route system."},"meta":[{"k":"Category","ko":"Branding","en":"Branding"},{"k":"Duration","ko":"6개월","en":"6 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"화성시","en":"Hwaseong City"},{"k":"ROLE","ko":"graphic designer","en":"graphic designer"}],"rows":[[{"r":1.622,"items":[{"src":"img/mv2cohzow8pm0h.jpg","x":50,"y":50,"z":1},{"src":"img/mv2cohzomsor0c.jpg","x":50.916391048791276,"y":46.64192132190266,"z":1.01}]}],[{"r":1.183,"items":[{"src":"img/pf-dongtan-02.jpg","x":50,"y":50,"z":1}]},{"r":1.183,"items":[{"src":"img/mv2cohznugxgkc.jpg","x":41.105881283562056,"y":49.337220803285255,"z":1.64},{"src":"img/mv2cohzni3ebpt.jpg","x":54.799256973448685,"y":57.61785262670273,"z":1.24}]}],[{"r":1.821,"items":[{"src":"img/pf-dongtan-05.jpg","x":25.484595833644093,"y":64.58500472035952,"z":1},{"src":"img/mv2cohzogim5by.jpg","x":50,"y":50,"z":1}]},{"r":1.821,"items":[{"src":"img/mv0u0vfqnusabc.jpg","x":48.22117820634579,"y":42.90374007496921,"z":1},{"src":"img/mv0u0vfq735tgk.jpg","x":50.513066629039926,"y":54.16677930363322,"z":1}]}]],"bg":"#c6f0f5","fg":"#14161a","pt":[{"src":"img/mv2cohzow8pm0h.jpg","r":2.022,"br":2,"x":50,"y":50,"z":1,"pw":1},{"src":"img/pf-dongtan-02.jpg","r":1.4791,"br":1,"x":50,"y":50,"z":1},{"src":"img/mv2cohznugxgkc.jpg","r":1.4791,"br":0,"x":41.105881283562056,"y":49.337220803285255,"z":1.64},{"src":"img/mv2cohzomsor0c.jpg","r":1.9969,"br":2,"x":50.916391048791276,"y":46.64192132190266,"z":1.41,"pw":1},{"src":"img/mv2cohzni3ebpt.jpg","r":1.5072,"br":1,"x":51.4,"y":54.4,"z":1.24},{"src":"img/mv2cohznugxgkc.jpg","r":1.5072,"br":0,"x":39.6,"y":48.8,"z":1.64},{"src":"img/mv0u0vfq735tgk.jpg","r":1.8004,"br":2,"x":47.1,"y":54.2,"z":1,"pw":1},{"src":"img/mv2cohzogim5by.jpg","r":1.8086,"br":1,"x":50,"y":50,"z":1},{"src":"img/mv0u0vfqnusabc.jpg","r":1.8086,"br":0,"x":48.22117820634579,"y":42.90374007496921,"z":1}],"pto":1},{"title":"SOMA Museum Merchandise","year":"2023","tags":["branding"],"map":[-0.04,-0.82],"desc":{"ko":"소마미술관에서 자체적으로 판매되는 굿즈의 응용디자인 가이드를 기존 소마미술관의 로고를 바탕으로 설계했다. 미술관의 기존 톤앤매너로부터 디자인 응용 방식을 간결한 방향으로 도출하였다. 로고가 원형을 자르고 조합하여 구성된 것에 착안하여 회전하는 원을 그래픽 모티브로 응용해 패턴을 개발했다.","en":"An application guide for merchandise sold by the SOMA Museum, built on the museum's existing logo. The way of applying the design was kept simple and drawn from the museum's established tone. Because the logo is made by cutting and combining circles, a rotating circle became the graphic motif for the pattern."},"meta":[{"k":"Category","ko":"Merchandise Design","en":"Merchandise Design"},{"k":"Duration","ko":"2개월","en":"2 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"소마미술관","en":"SOMA Museum"},{"k":"ROLE","ko":"Project manager","en":"Project manager"}],"rows":[[{"r":1.786,"items":[{"src":"img/pf-soma-03.jpg","x":49.37609923497034,"y":59.65973455484087,"z":1.32,"fit":"contain"}]}],[{"r":0.926,"items":[{"src":"img/pf-soma-01.jpg","x":47.727329799107146,"y":50.1451667906746,"z":1,"fit":"contain"}]},{"r":0.926,"items":[{"src":"img/pf-soma-02.jpg","x":49.11185825892857,"y":45.83998584242725,"z":0.98,"fit":"contain"}]}]],"bg":"#d4d4d4","fg":"#14161a","pt":[{"src":"img/pf-soma-03.jpg","r":1.9648,"br":2,"x":49.3,"y":58.3,"z":1.44,"fit":"contain","pw":1},{"src":"img/pf-soma-01.jpg","r":1.5458,"br":1,"x":47.727329799107146,"y":50.1451667906746,"z":1.17,"fit":"contain"},{"src":"img/pf-soma-02.jpg","r":1.5458,"br":0,"x":48.9,"y":55.8,"z":1.37,"fit":"contain"}],"pto":5},{"title":"Yeoui Roll Park","year":"2023","tags":["space","branding","signage"],"map":[0.72,1.1],"desc":{"ko":"액티브 디자인은 도시 환경 개선을 통해 적절한 신체활동을 유도하는 도시 중심 디자인 개념이다. 서울형 액티브 디자인 개발을 위한 공원 조성을 목표로 시작되었다. \n\n여의도 서울색공원에 러닝 트랙, 체조를 위한 고무칩 매트, 바퀴 기구를 탈 수 있는 펌프트랙을 구성했고, 장애인 스포츠 단체 ‘좋은 운동장’의 협조로 휠체어 주행을 직접 진행하며 트랙을 수정했다.\n\n메인컬러는 장애인과 사회적 약자를 포용하는 의미의 보라색으로, 청록과 오렌지를 포인트로 더해 교각 아래의 어둡고 차가운 분위기를 벗어났다. 8개의 바퀴 종류를 의미하는 ‘8 wheels’ 로고는 바닥 그래픽, 안내판, 팜플렛, 의류에 적용되었다.","en":"Active design is a city-centred design concept that encourages appropriate physical activity by improving the urban environment. The project began with the aim of building a park to develop a Seoul model of active design.\n\nAt Seoul Saekgongwon in Yeouido it combines a running track, rubber-chip mats for exercise and a pump track for wheeled equipment. The track was adjusted through real wheelchair test runs with the help of Good Playground, a group for disabled sports.\n\nThe main colour is purple, standing for the inclusion of disabled and vulnerable people, with teal and orange accents to lift the dark, cold mood under the bridge. The ‘8 wheels’ logo, for the eight kinds of wheels, is applied to ground graphics, signs, leaflets and clothing."},"meta":[{"k":"Category","ko":"Environmental Design","en":"Environmental Design"},{"k":"Duration","ko":"12개월","en":"12 months"},{"k":"Company","ko":"SOAP","en":"SOAP"},{"k":"Client","ko":"서울특별시","en":"Seoul Metropolitan City"},{"k":"ROLE","ko":"Project manager","en":"Project manager"}],"rows":[[{"r":1.724,"items":[{"src":"img/pf-yeoui-08.jpg","x":50,"y":50,"z":1},{"src":"img/pf-yeoui-12.jpg","x":50,"y":50,"z":1},{"src":"img/pf-yeoui-09.jpg","x":50,"y":50,"z":1},{"src":"img/pf-yeoui-13.jpg","x":50,"y":50,"z":1},{"src":"img/pf-yeoui-11.jpg","x":50,"y":50,"z":1},{"src":"img/mv0ubqo7hm2j46.jpg","x":50,"y":50,"z":1},{"src":"img/mv0ubqo7v5im8w.jpg","x":50,"y":50,"z":1},{"src":"img/mv0ubqo78iixyz.jpg","x":49.98698239970559,"y":53.43969535454379,"z":1},{"src":"img/mv0ubqo7tc6d4p.jpg","x":49.447322071046756,"y":69.84355163574219,"z":1}]}],[{"r":1.375,"items":[{"src":"img/mv0ubqo74w4h7d.jpg","x":50.65365635396863,"y":59.06415226483586,"z":1},{"src":"img/mv330ca7pbb77s.jpg","x":50.67795114058924,"y":29.44000052206172,"z":1.29},{"src":"img/mv330ca76nresr.jpg","x":56.53754961026888,"y":30.664158467226805,"z":1.25},{"src":"img/mv330ca7ufbhk4.jpg","x":55.07340420301774,"y":37.5648354584316,"z":1.27}]},{"r":1.375,"items":[{"src":"img/mv0ubqo718gvp0.jpg","x":48.64413765446768,"y":47.45401709970802,"z":1.02},{"src":"img/mv0ubqo7h1mb31.jpg","x":50,"y":50,"z":1}]}],[{"r":1.473,"items":[{"src":"img/pf-yeoui-05.jpg","x":50,"y":50,"z":1},{"src":"img/mv0ubqo724jco2.jpg","x":50,"y":50,"z":1}]},{"r":1.473,"items":[{"src":"img/pf-yeoui-07.jpg","x":50,"y":50,"z":1},{"src":"img/mv0ubqo7kg2ajv.jpg","x":45.749957298597906,"y":49.618333011525664,"z":1.06}]}]],"bg":"#b06ce9","fg":"#f4f1ea","pt":[{"src":"img/mv0ubqo7tc6d4p.jpg","r":1.9533,"br":2,"x":49.4,"y":100,"z":1,"pw":1},{"src":"img/mv0ubqo7hm2j46.jpg","r":1.5603,"br":1 Design"},{"k":"Duration","ko":"6개월","en":"6 months"},{"k":"Company","ko":"Pointnine","en":"Pointnine"},{"k":"ROLE","ko":"Project manager","en":"Project manager"}],"rows":[[{"r":1.603,"items":[{"src":"img/pf-gokmul-02.jpg","x":51.82120845002948,"y":78.81460496293124,"z":1},{"src":"img/pf-gokmul-06.jpg","x":51.91719487028302,"y":100,"z":1},{"src":"img/pf-gokmul-07.jpg","x":52.99368389332983,"y":100,"z":1}]}],[{"r":1.207,"items":[{"src":"img/pf-gokmul-01.jpg","x":50,"y":50,"z":1}]},{"r":1.207,"items":[{"src":"img/pf-gokmul-03.jpg","x":49.62971034084129,"y":71.59463053803825,"z":1}]}],[{"r":1.243,"items":[{"src":"img/pf-gokmul-04.jpg","x":50,"y":50,"z":1}]},{"r":1.243,"items":[{"src":"img/pf-gokmul-05.jpg","x":50,"y":50,"z":1}]}]],"bg":"#e2dbd5","fg":"#14161a","pt":[{"src":"img/pf-gokmul-02.jpg","r":1.9192,"br":2,"x":51.8,"y":79.1,"z":1,"pw":1},{"src":"img/pf-gokmul-01.jpg","r":1.6065,"br":1,"x":50,"y":50,"z":1},{"src":"img/pf-gokmul-03.jpg","r":1.6065,"br":0,"x":49.6,"y":100,"z":1},{"src":"img/pf-gokmul-06.jpg","r":1.7909,"br":2,"x":51.9,"y":100,"z":1,"pw":0.9999882599826981},{"src":"img/pf-gokmul-05.jpg","r":1.3303,"br":1,"x":18.1,"y":50,"z":1},{"src":"img/pf-gokmul-04.jpg","r":1.5204,"br":0,"x":50,"y":66.9,"z":1},{"src":"img/pf-gokmul-07.jpg","r":1.5204,"br":0,"x":52.99368389332983,"y":100,"z":1.55}],"pto":11},{"title":"ONTZ","year":"2022","tags":["branding"],"map":[-0.88,0.24],"desc":{"ko":"온츠는 남녀가 편안하게 착용할 수 있는 유니섹스 브랜드로 2019년 런칭하였다. ‘over normal to zenith’라는 슬로건에 맞게 담백하고 기본적인 퀄리티를 추구하는 브랜드의 이미지를 표현하는 브랜드 아이덴티티를 정립했다. 심볼로고는 O와 n이 겹쳐진 모노그램으로 웹과 의류 등 다양한 매체에 적용된다.","en":"ONTZ is a unisex clothing brand launched in 2019. Following its slogan ‘over normal to zenith’, the identity expresses a brand that pursues plain, basic quality. The symbol is a monogram of an overlapping O and n, applied across the web, garments and other media."},"meta":[{"k":"Category","ko":"Branding","en":"Branding"},{"k":"Duration","ko":"12개월","en":"12 months"},{"k":"Company","ko":"Pointnine","en":"Pointnine"},{"k":"Visual Director","ko":"Jaewook Kim","en":"Jaewook Kim"},{"k":"ROLE","ko":"Graphic designer","en":"Graphic designer"}],"rows":[[{"r":1.78,"items":[{"src":"img/mv0udyifdmelhx.jpg","x":50,"y":50,"z":1}]}],[{"r":1,"items":[{"src":"img/mv0udyif7izwey.jpg","x":50.974566673597906,"y":3.552710239424904,"z":1.45}]},{"r":1,"items":[{"src":"img/pf-ontz-02.jpg","x":50,"y":50,"z":1},{"src":"img/mv0udyif3vfl1t.jpg","x":0,"y":65.36329146120485,"z":1.16},{"src":"img/mv0udyif62gakp.jpg","x":80.57726725879277,"y":48.340481950302994,"z":1}]}]],"bg":"#e1d1b8","fg":"#14161a","pt":[{"src":"img/mv0udyifdmelhx.jpg","r":1.8991,"br":2,"x":50,"y":50,"z":1,"pw":0.9999996799817267},{"src":"img/mv0udyif7izwey.jpg","r":1.6358,"br":1,"x":50.974566673597906,"y":3.552710239424904,"z":1.45},{"src":"img/pf-ontz-02.jpg","r":1.6358,"br":0,"x":50,"y":53.6,"z":1}],"pto":12},{"title":"Infinity or Nothing","year":"2022","tags":["art","exhibition"],"map":[0.06,0.11],"desc":{"ko":"현재는 갑작스럽게 우리에게 도래하지 않는다. 나의 시선과 타자와의 만남은 스쳐 지나갔던 수많은 만남과 오랜 길들을 훑었던 시선들의 반복과 변형으로 이뤄진 복합적인 산출물이다.\n\n세면대에서 떨어지는 물소리, 아침의 새소리, 아이들의 장난처럼 하릴없어 보이는 것들은 목적을 향해 소리 없이 사라지는 듯 보인다. 이번 전시는 ‘사이’와 ‘틈’에 존재했던, 그렇게 사라진 줄 알았던 일상의 접합점들을 모양과 형태 그 자체로 재발굴하여 익숙한 과거 속의 낯선 현재를 보여준다.","en":"The present does not arrive suddenly. My gaze and each encounter with another are compound products of the countless encounters that have passed and of gazes repeated and varied along long roads.\n\nThings that seem idle, such as water dripping in a sink, birdsong in the morning or children's pranks, appear to vanish silently into the purposes they serve. This exhibition digs up those joints of everyday life that lived in the gaps and seemed lost, as shapes and forms in themselves, showing an unfamiliar present inside a familiar past."},"meta":[{"k":"Category","ko":"Art Project","en":"Art Project"},{"k":"Duration","ko":"3개월","en":"3 months"},{"k":"Artist","ko":"Youngmi Lee","en":"Youngmi Lee"},{"k":"Space","ko":"Junleung Base","en":"Junleung Base"}],"rows":[[{"r":1.762,"items":[{"src":"img/pf-infinity-02.jpg","x":50,"y":50,"z":1}]}],[{"r":0.834,"items":[{"src":"img/pf-infinity-01.jpg","x":50,"y":50,"z":1}]},{"r":0.834,"items":[{"src":"img/pf-infinity-03.jpg","x":50,"y":50,"z":1}]}]],"bg":"#5c94c1","fg":"#f4f1ea","hide":true},{"title":"Museum Geivert","year":"2021","tags":["editorial"],"map":[-0.57,-0.72],"desc":{"ko":"미술관이라는 공간 경험에 대한 대안적인 방식을 서사적으로 풀어나가는 작은 소책자다. 미술관의 특수한 경험은 어떠한 방식으로 발생하는가, 관계성 외에 아무것도 없다면 어떤 경험이 남는가에 관한 질문에서 시작된 산발적인 작은 문단들로 구성되었다.\n\n종이는 여러 장을 두텁게 겹친 배접지를 사용하고 흰색 실로 제본하였다. 전시공간에서 관람객이 볼 수 있도록 배치되어 연약하지만 쉽게 손상되지 않는 재료로 마감되었다.","en":"A small booklet that narrates alternative ways of experiencing the museum as a space. It is made of scattered short paragraphs that start from questions: how does the particular experience of a museum arise, and what remains if there is nothing but relations?\n\nIt uses thick paper laminated from several sheets and is bound with white thread. Made to be handled by visitors in an exhibition space, it is finished in materials that are fragile yet not easily damaged."},"meta":[{"k":"Category","ko":"Book Design, Text","en":"Book Design, Text"},{"k":"Duration","ko":"3개월","en":"3 months"},{"k":"Credit","ko":"단독 프로젝트","en":"Solo project"}],"rows":[[{"r":1.624,"items":[{"src":"img/pf-geivert-02.jpg","x":50.3899028548066,"y":52.15458614328212,"z":1}]}]],"bg":"#212123","fg":"#f4f1ea","hide":true},{"title":"Yongsan 2021","year":"2021","tags":["art"],"map":[-0.85,0.6],"desc":{"ko":"용산은 복잡한 시간의 레이어가 교차하는 장소다. 현재 높은 아파트로 정비된 용산 4구역은 재개발 당시 ‘용산 참사’가 일어났던 장소이기도 하다. 도시개발은 과거의 기억을 깔끔하게 삭제하는 ‘포맷’의 행위이기도 하다.\n\n참사가 일어난 2009년에 출시된 핸드폰을 10년 넘는 시간 만에 재충전해 거리로 나가 용산 4구역을 촬영했다. 사진 매체는 그것이 제작된 시기의 분위기를 담는다. 구시대적 매체가 시간의 온기를 간직하고 오늘을 다른 눈으로 포착하는 운동성이 개발의 말끔한 소거법을 의심한다.","en":"Yongsan is a place where complex layers of time cross. Yongsan District 4, now rebuilt as tall apartment blocks, is also where the ‘Yongsan disaster’ took place during redevelopment. Urban development is also an act of ‘formatting’ that cleanly deletes the memory of the past.\n\nA mobile phone released in 2009, the year of the disaster, was recharged after more than ten years and taken out to photograph District 4. A photographic medium carries the mood of the time it was made. An outdated medium that keeps the warmth of time and catches today through a different eye casts doubt on development's tidy erasure."},"meta":[{"k":"Category","ko":"Art Project","en":"Art Project"},{"k":"Duration","ko":"1개월","en":"1 month"},{"k":"Credit","ko":"단독 프로젝트","en":"Solo project"}],"rows":[[{"r":1.674,"items":[{"src":"img/pf-yongsan-02.jpg","x":50,"y":50,"z":1},{"src":"img/pf-yongsan-06.jpg","x":50,"y":50,"z":1},{"src":"img/pf-yongsan-07.jpg","x":50,"y":50,"z":1}]}],[{"r":1.069,"items":[{"src":"img/pf-yongsan-01.jpg","x":50,"y":50,"z":1}]},{"r":1.069,"items":[{"src":"img/pf-yongsan-03.jpg","x":50,"y":50,"z":1}]}]],"bg":"#0d0d0d","fg":"#f4f1ea","hide":true},{"title":"Midam","year":"2021","tags":["editorial"],"map":[-0.56,-0.33],"desc":{"ko":"미담은 한살림 소속 모심과살림연구소를 중심으로 모인 청년들이 만드는 비정기 무크지로, ‘미래를 바꾸는 담론’이라는 의미를 지닌다. 1호는 ‘사회에 균열을 내는 사람들’이라는 부제에 걸맞게 얼어붙은 빙판을 깨트리는 듯한 일러스트로 디자인되었다. 표지는 상단과 하단이 강한 대비로 구분되며, 붉은 바위와 흰 바닥의 균열이 대비되면서 함께 ‘목소리’를 표현한다.\n\n2호는 가볍고 경쾌하게 주변 사람들의 일상을 들어보는 취지로 기획되어, 색채를 더 다양하게 시도하고 균열 뒤 피어나는 작은 새싹으로 이전 호와의 연속성을 보여주었다.","en":"Midam is an occasional mook made by young people gathered around the Mosim and Salim Institute of Hansalim; the name means ‘discourse that changes the future’. Issue 1, subtitled ‘people who crack society’, uses an illustration that looks like ice being broken. The cover splits into strongly contrasting upper and lower halves, where a red rock and a cracked white ground stand against each other and together express a ‘voice’.\n\nIssue 2 was planned as a lighter look at the everyday lives of people around us, with a wider range of colour and a small sprout growing after the crack to connect it to the first issue."},"meta":[{"k":"Category","ko":"Book Design, Editorial","en":"Book Design, Editorial"},{"k":"Duration","ko":"5개월","en":"5 months"},{"k":"Client","ko":"한살림","en":"Hansalim"}],"rows":[[{"r":1.494,"items":[{"src":"img/pf-midam-02.jpg","x":50,"y":50,"z":1},{"src":"img/pf-midam-07.jpg","x":49.99966670221843,"y":50.01894892478476,"z":1},{"src":"img/pf-midam-08.jpg","x":50.022165398848685,"y":50.05970001220703,"z":1},{"src":"img/mv0uhqvomw9zk1.jpg","x":50,"y":50,"z":1.11},{"src":"img/mv0uhqvovdzw9j.jpg","x":50,"y":50,"z":1.03}]}],[{"r":1.683,"items":[{"src":"img/mv0uhqvoc1z8uf.jpg","x":65.52836487048481,"y":57.58021983438486,"z":1.68}]},{"r":1.683,"items":[{"src":"img/mv0uhqvoy5105k.jpg","x":50,"y":50,"z":1}]}]],"bg":"#2e312c","fg":"#f4f1ea","pt":[{"src":"img/mv0uhqvovdzw9j.jpg","r":1.4823,"br":2,"x":50,"y":50,"z":1.03,"pw":0.879},{"src":"img/mv0uhqvoc1z8uf.jpg","r":1.8405,"br":1,"x":65.52836487048481,"y":57.58021983438486,"z":1.68},{"src":"img/mv0uhqvoy5105k.jpg","r":1.8405,"br":0,"x":50,"y":50,"z":1},{"src":"img/mv0uhqvomw9zk1.jpg","r":1.494,"br":2,"x":50,"y":50,"z":1.11},{"src":"img/pf-midam-07.jpg","r":1.494,"br":0,"x":49.99966670221843,"y":50.01894892478476,"z":1},{"src":"img/pf-midam-08.jpg","r":1.494,"br":1,"x":50.022165398848685,"y":50.05970001220703,"z":1},{"src":"img/pf-midam-02.jpg","r":1.494,"br":0,"x":50,"y":50,"z":1}],"pto":13},{"title":"Pointnine","year":"2020","tags":["branding"],"map":[-0.55,0.07],"desc":{"ko":"포인트나인은 2020년 시작한 온라인 커머스 전문 인큐베이팅 스타트업으로, “0.1%의 창의적 인간과 그것을 알아보고 협력한 0.9%의 안목 있는 인간”이 문명사회를 건설했다는 제레미 리프킨의 문장에서 0.9%의 협력자를 지향하는 브랜드다.\n\n숫자 ‘9’를 강조하여 9 앞의 온점과 9 내부의 비어 있는 원의 관계로 생산업체와 인큐베이팅 업체의 관계를 표현하였다. 로고타입엔 ‘Red Hat Display’ 서체를 사용했고, 협력사에게 신뢰를 줄 수 있는 정적이고 차분한 톤으로 설정되었다.","en":"Pointnine is an incubating startup for online commerce founded in 2020. The brand aims to be the 0.9% collaborator in Jeremy Rifkin's line that civilisation was built by “the 0.1% of creative people and the 0.9% with the eye to recognise and work with them”.\n\nThe design stresses the number 9, expressing the relation between producers and the incubator through the dot before the 9 and the empty circle inside it. The logotype uses Red Hat Display, in a calm, static tone meant to earn the trust of partners."},"meta":[{"k":"Category","ko":"Branding","en":"Branding"},{"k":"Duration","ko":"4개월","en":"4 months"},{"k":"Company","ko":"Pointnine","en":"Pointnine"},{"k":"Client","ko":"Pointnine","en":"Pointnine"}],"rows":[[{"r":1.493,"items":[{"src":"img/pf-pointnine-01.jpg","x":49.976389031661185,"y":50.040571027774874,"z":0.88,"fit":"contain","bg":"#ffffff"}]}]],"bg":"#1a5ea9","fg":"#ffffff","hide":true},{"title":"Saeroi","year":"2020","tags":["art","poster"],"map":[-0.85,-0.49],"desc":{"ko":"2020년 아트토크 시리즈 전시를 위해 진행된 작업이다. 코로나19의 장기화로 언택트 전시가 새로운 표준이 되었을 때 미래의 전시의 모습에 관해 질문을 던졌다.\n\n포스터는 손으로 새를 형상화한 이미지가 여럿 배치되어 함께 날아가는 모습을 연상시키며, 키넥트의 3D 입체 센서로 촬영되었다. 촉각의 도구인 손이 이미지를 형상하며 또 다른 운동으로 함께하는 풍경을 상상한다.","en":"A work made for the 2020 Art Talk exhibition series. It asked what exhibitions might look like once contact-free shows became the new standard during the long COVID-19 pandemic.\n\nThe poster arranges several images of hands shaped as birds so that they seem to fly together, captured with the 3D depth sensor of a Kinect. It imagines a scene in which the hand, the tool of touch, forms images and joins in another kind of movement."},"meta":[{"k":"Category","ko":"Art Project","en":"Art Project"},{"k":"Duration","ko":"1개월","en":"1 month"},{"k":"Credit","ko":"단독 프로젝트","en":"Solo project"}],"rows":[[{"r":1.528,"items":[{"src":"img/pf-saeroi-01.jpg","x":50.000431852520634,"y":49.97134543622286,"z":0.86,"fit":"contain","bg":"#1f1f1f"}]}]],"bg":"#010101","fg":"#f4f1ea","pto":14},{"title":"Geulim","year":"2019","tags":["editorial"],"map":[-0.92,-0.77],"desc":{"ko":"‘그을림’은 서울공항에서 함께 군 복무를 하던 여덟 명이 2019년 한 해 동안 16권의 책을 읽고 이야기를 나누며 작성한 텍스트를 엮은 결과물이다. 모임 이름은 ‘그을리다’라는 뜻과 글을 읽는 모임이라는 두 가지 의미를 병합해 제작했다.\n\n앞표지와 책등을 구성하는 로고타입은 원, 정사각형, 삼각형, x자 등 최소한의 도형으로 구성해 글자와 도형 사이의 애매한 읽힘을 의도했다. 기하학적인 디자인이 장르를 규정짓지 않는 중립성을 표현하면서도 실험적인 공동체의 성격을 드러낸다.","en":"‘Geulim’ collects texts written by eight people who served together at Seoul Air Base and spent 2019 reading and discussing sixteen books. The name merges two meanings in Korean: to be scorched, and a gathering that reads writing.\n\nThe logotype on the cover and spine is built from minimal shapes, a circle, square, triangle and x, aiming for an ambiguous reading between letter and shape. The geometric design expresses a neutrality that does not fix a genre while showing the experimental character of the group."},"meta":[{"k":"Category","ko":"Book Design, Editorial","en":"Book Design, Editorial"},{"k":"Duration","ko":"12개월","en":"12 months"},{"k":"Credit","ko":"단독 프로젝트","en":"Solo project"}],"rows":[[{"r":1.676,"items":[{"src":"img/pf-geulim-02.jpg","x":50,"y":50,"z":1},{"src":"img/mv0umgt2j1ye22.jpg","x":50,"y":50,"z":1},{"src":"img/mv0umgt2x6cstb.jpg","x":50,"y":50,"z":1}]}]],"bg":"#ffffff","fg":"#14161a","pto":15},{"title":"Pareidolia","year":"2017","tags":["editorial"],"map":[-0.35,-0.8],"desc":{"ko":"사물에서 사람의 얼굴을 인지하는 현상인 파레이돌리아(Pareidolia)를 주제로 제작된 사진집이다. 500여 개의 사진으로 구성되었으며, 감정이라는 큰 카테고리 안에 색상, 형태, 사물의 종류에 따라 다르게 배치되어 있다.","en":"A photo book on pareidolia, the phenomenon of seeing human faces in objects. It contains around 500 photographs, arranged within the broad category of emotion by colour, shape and type of object."},"meta":[{"k":"Category","ko":"Book Design, Editorial","en":"Book Design, Editorial"},{"k":"Duration","ko":"4개월","en":"4 months"},{"k":"Credit","ko":"단독 프로젝트","en":"Solo project"}],"rows":[[{"r":1.563,"items":[{"src":"img/pf-pareidolia-01.jpg","x":50,"y":50,"z":0.8,"fit":"contain"},{"src":"img/mv0umgt2afoktw.jpg","x":50,"y":50,"z":1}]}],[{"r":1.12,"items":[{"src":"img/pf-pareidolia-02.jpg","x":50,"y":50,"z":1}]},{"r":1.12,"items":[{"src":"img/pf-pareidolia-03.jpg","x":50,"y":50,"z":1}]}]],"bg":"#000000","fg":"#f4f1ea","pto":16},{"title":"Fenêtre","year":"2017","tags":["editorial","poster"],"map":[-0.31,-0.4],"desc":{"ko":"창문은 사람과 사람 사이를 연결해주는 그래픽 디자인의 기능에 대한 메타포다. ‘Fenêtre’는 2년 동안 모은 건물의 창문 사진을 바탕으로 제작된 패턴 모음집으로, 이미지를 변형해 원근을 없애고 무한히 확장되는 패턴을 만들었다.\n\n포스터는 창문의 패턴과 프랑스어 단어 ‘Fenêtre’의 반복을 포개어, 해가 진 밤 높은 빌딩의 밝은 창문과 꺼진 창문이 교차하며 만드는 그래픽 이미지를 형상화했다.","en":"The window is a metaphor for graphic design's function of connecting people. ‘Fenêtre’ is a collection of patterns made from photographs of building windows gathered over two years, with the images altered to remove perspective and extend endlessly.\n\nThe poster overlays the window pattern with the repeated French word ‘Fenêtre’, picturing the graphic image made by lit and dark windows crossing on tall buildings after sunset."},"meta":[{"k":"Category","ko":"Book Design, Editorial","en":"Book Design, Editorial"},{"k":"Duration","ko":"4개월","en":"4 months"},{"k":"Credit","ko":"단독 프로젝트","en":"Solo project"}],"rows":[[{"r":1.598,"items":[{"src":"img/pf-fenetre-02.jpg","x":50,"y":50,"z":1},{"src":"img/pf-fenetre-06.jpg","x":51.387601989121166,"y":24.900213068181817,"z":1}]}],[{"r":1.196,"items":[{"src":"img/pf-fenetre-01.jpg","x":50,"y":50,"z":1}]},{"r":1.196,"items":[{"src":"img/pf-fenetre-03.jpg","x":50,"y":50,"z":1},{"src":"img/mv0umgt2jf5ygw.jpg","x":49.52833038015464,"y":43.298540507277394,"z":1},{"src":"img/mv0umgt2w3phko.jpg","x":50,"y":50,"z":1},{"src":"img/mv0umgt2rjssft.jpg","x":50,"y":50,"z":1}]}]],"bg":"#232223","fg":"#f4f1ea","hide":true},{"title":"Abécédaire","year":"2017","tags":["editorial"],"map":[-0.6,-0.99],"desc":{"ko":"들뢰즈는 다큐멘터리 프로그램 ‘Abécédaire(질 들뢰즈의 A to Z)’에서 알파벳 순서에 맞춘 키워드로 자신의 철학 세계를 열어 보인다. 본 프로젝트는 우연적인 배열을 통해 도출될 수 있는 디자인의 요소를 나열해보는 의도로 구성되었다.\n\n백과사전처럼 두꺼운 책의 측면에 색인을 표기하는 ‘썸 인덱스(Thumb Index)’로 구성된 이 책은 알파벳 순서로 그래픽 디자인에 관한 키워드를 담고 있다. 순서와 배치를 통한 권위를 포기하고, 독자의 읽기 행위에 의해 분해된 자잘한 텍스트 조각의 모음이 된다.","en":"In the documentary ‘Abécédaire (Gilles Deleuze from A to Z)’, Deleuze opens up his philosophy through keywords in alphabetical order. This project was built to lay out the design elements that can emerge from such an arbitrary arrangement.\n\nMade with a thumb index, the kind cut into the edge of thick books such as encyclopaedias, the book holds keywords on graphic design in alphabetical order. It gives up the authority of sequence and placement and becomes a collection of small pieces of text taken apart by the reader's act of reading."},"meta":[{"k":"Category","ko":"Book Design, Editorial","en":"Book Design, Editorial"},{"k":"Duration","ko":"2개월","en":"2 months"},{"k":"Credit","ko":"단독 프로젝트","en":"Solo project"}],"rows":[[{"r":1.433,"items":[{"src":"img/pf-abecedaire-02.jpg","x":50,"y":50,"z":1},{"src":"img/mv0umgt23fsgvh.jpg","x":50,"y":50,"z":1}]}]],"bg":"#d0d0d0","fg":"#14161a","hide":true},{"title":"Transformation","year":"2017","tags":["art","editorial"],"map":[-0.95,-0.15],"desc":{"ko":"‘변환’은 프랑스 대학 졸업전시에서 발표한 세 개의 프로젝트 중 가장 중심적인 프로젝트다. “무의미한 단어들로 쓰인 글이 무의미함 그 자체를 전달하는 것을 목적으로 한다면 이는 또 하나의 의미를 가질 수 있을까?”라는 질문에서 시작했다. 프란츠 카프카의 소설 『변신』은 기계번역기에 의해 ‘변환(transformation)’이라는 단어로 오독되며, 본문은 총 5개의 언어로 기계번역된다.\n\n표지는 벌레 이미지 여럿을 포개고 노이즈 역할의 필터로 왜곡해 형상을 추상화했다. 각 언어의 판본은 문장구조가 뒤틀리고 부적절한 단어가 선정되어 낯설게 읽힌다. 완벽함으로 재설정되는 시대에 사라지지 않은 기계의 어설픔이 만들어낼 수 있는 독특한 언어를 담고자 했다.","en":"‘Transformation’ is the central one of three projects shown at the graduation exhibition in France. It began with a question: if a text written in meaningless words aims to convey meaninglessness itself, can it take on another meaning? Franz Kafka's novel The Metamorphosis is misread by a machine translator as ‘transformation’, and the text is machine-translated into five languages.\n\nThe cover overlays several images of insects and distorts them with a noise-like filter until the form becomes abstract. Each language edition reads strangely, with twisted sentence structures and ill-chosen words. The project tries to hold the peculiar language that a machine's clumsiness can still produce in an age being reset towards perfection."},"meta":[{"k":"Category","ko":"Art Project","en":"Art Project"},{"k":"Duration","ko":"4개월","en":"4 months"},{"k":"Credit","ko":"단독 프로젝트","en":"Solo project"}],"rows":[[{"r":1.856,"items":[{"src":"img/pf-transformation-05.jpg","x":63.16575879766753,"y":85.01228073342244,"z":3,"fit":"contain","bg":"#eaecf9"},{"src":"img/mv2dnpy7jxf5mx.jpg","x":47.43839479842276,"y":43.047614901018875,"z":1}]}],[{"r":1.141,"items":[{"src":"img/pf-transformation-06.jpg","x":50.00054363297065,"y":51.42078003211605,"z":1.02,"fit":"contain","bg":"#c7c7c7"},{"src":"img/mv2dnpy7ai50tn.jpg","x":50,"y":50,"z":1}]},{"r":1.141,"items":[{"src":"img/pf-transformation-07.jpg","x":50,"y":50,"z":1.06,"fit":"contain"},{"src":"img/mv2dnpy7jtc9sv.jpg","x":50,"y":50,"z":1}]}]],"bg":"#c5c5c5","fg":"#14161a","hide":true},{"title":"Abduction Cow Milk","year":"2013","tags":["art"],"map":[-1.02,0.92],"desc":{"ko":"경기예술고등학교 재학 중 방과후 프로그램으로 제작된 스톱모션 애니메이션으로, 젖소가 외계인에게 납치되는 사건을 다룬다. 3인 공동감독 구성으로 제작되었으며 오타와 국제 애니메이션 페스티벌에서 학생 부문 대상을 수상했다.\n\n디자이너를 본격적으로 꿈꾸기 이전에 유일하게 작품 형태로 완성된 작업이다.","en":"A stop-motion animation made in an after-school programme at Gyeonggi Arts High School, about a dairy cow abducted by aliens. It was made by three co-directors and won the grand prize in the student category at the Ottawa International Animation Festival.\n\nIt is the only work completed as a finished piece before seriously dreaming of becoming a designer."},"meta":[{"k":"Category","ko":"Animation","en":"Animation"},{"k":"Duration","ko":"12개월","en":"12 months"},{"k":"Affiliation","ko":"경기예술고등학교","en":"Gyeonggi Arts High School"},{"k":"Director","ko":"Woosol Lee, Hyunji Yoon, Shinhye Kim","en":"Woosol Lee, Hyunji Yoon, Shinhye Kim"}],"rows":[[{"r":1.681,"items":[{"src":"img/pf-abduction-01.jpg","x":50,"y":50,"z":1},{"src":"img/mv2g5nnlko2txn.jpg","x":91.46106013112558,"y":21.106332873540154,"z":1}]}]],"bg":"#aafcfd","fg":"#14161a","hide":true}],"info":[[{"l":0,"h":"Woosol Lee:","lines":[{"ko":"그래픽 디자이너","en":"Graphic Designer"}]},{"l":0,"h":"About:","lines":[{"ko":"프랑스 브장송예술학교에서 시각디자인(Com const NAVS = `<button class="nav prev" type="button" aria-label="Previous image"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 4 7 12 15 20"/></svg></button><button class="nav next" type="button" aria-label="Next image"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 4 17 12 9 20"/></svg></button>`;

function slotHtml(pi, row, ri, sl, si) {

  const slides = items.map((it, k) => `<div class="slide"${it.fit === "contain" ? ` style="background:${esc(it.bg || "var(--pbg)")}"` : ""}>` + (it.vimeo
    ? `<a class="vid" href="https://vimeo.com/${esc(it.vimeo)}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span class="vl">Vimeo ↗</span></a>`
    : it.src ? `<img src="${esc(show(it.src))}" alt="" draggable="false" decoding="async" style="${imgStyle(it)}"${k ? ' loading="lazy"' : ""}>`
    : `<span class="phl">${ratioName(r)}</span>`) + `</div>`).join("");
  const tools = !editing ? "" : `<div class="stools">` + btn("img-add", "＋ " + L("image") + " · PDF", d) + btn("vimeo", "＋ Vimeo", d)
    + `<select class="eb" data-a="ratio" ${d} aria-label="Ratio">${(RATIOS.some(x => x[1] == r) ? "" : `<option value="${r}" selected>${(+r).toFixed(2)}:1</option>`) + RATIOS.map(([n, v]) => `<option value="${v}"${v == r ? " selected" : ""}>${n}</option>`).join("")}</select>`
    + (many ? btn("s-prev", "‹", d) + btn("s-next", "›", d) : "")
    + `<label class="eb zoom">${L("zoom")}<input type="range" min="1" max="3" step="0.01" value="1" data-a="zoom" ${d}></label>`
    + btn("fit", L("fitIn"), d) + `<label class="eb ibg" hidden>${L("margin")}<input type="color" value="#ffffff" data-a="ibg" ${d}></label>`
    + btn("item-del", L("delItem"), d) + (SITE.projects[pi].rows.flat().length > 1 ? btn("slot-del", L("delSlot"), d) : "") + `</div>`;
  return `<figure class="ph${many ? " multi" : ""}" style="--r:${r}" ${d}><div class="track">${slides}</div>`
    + (many ? NAVS + `<span class="count">1/${items.length}</span>` : "") + tools + `</figure>`;

function projectHtml(p, i) {

    </div><div class="rows">${rows}</div></div>

  </article>`;
}

function renderAll(jump) {

  $$(".ph").forEach(ph => pos[key(ph)] = at($(".track", ph)));
  $("#view-work").innerHTML = SITE.projects.map(projectHtml).join("");
  $("#pins").innerHTML = mapHtml();
  $("#info").innerHTML = infoHtml();
  $("#tags").innerHTML = `<a class="pill" href="#all" data-tag="">All</a>` + SITE.tags.map(t => `<a class="pill" href="#${t}" data-tag="${t}">${cap(t)}</a>`).join("");
  $("#empty").textContent = L("empty"); $("#to-top").textContent = L("top");
  $("#ed-add").textContent = L("addProject"); $("#ed-save").textContent = L("save"); $("#ed-exit").textContent = L("exit");

function syncSlot(ph) {

const slotOf = el => SITE.projects[el.dataset.p].rows[el.dataset.r][el.dataset.s];

const langBtn = $("#lang-btn"), genreBtn = $("#genre-btn"), genreMenu = $("#tags"), topBar = $(".top"), root = document.documentElement;
const openGenre = on => { genreMenu.hidden = !on; genreBtn.setAttribute("aria-expanded", on); };
function applyView() {
  const h = location.hash.slice(1), info = h === "info", map = h === "map", tag = SITE.tags.includes(h) ? h : "";
  $("#view-info").hidden = !info; $("#view-map").hidden = !map; $("#view-work").hidden = info || map;
  let shown = 0;
  $$(".project").forEach(a => { const ok = !tag || a.dataset.tags.split(" ").includes(tag); a.hidden = !ok || (a.classList.contains("locked") && !listing); if (!a.hidden) shown++; });
  $("#empty").hidden = info || map || shown > 0;

  open.forEach((a, i) => $(".down", a).hidden = i === open.length - 1);
  const mark = (el, on) => on ? el.setAttribute("aria-current", "true") : el.removeAttribute("aria-current");
  $$("#tags a").forEach(a => mark(a, !info && !map && a.dataset.tag === tag));

  paintBand();
}
function route() {

  if (target && listing) { openSet.add(+h.slice(2)); target.classList.add("open"); }
  window.scrollTo(0, target ? target.getBoundingClientRect().top + scrollY - topBar.offsetHeight : 0);

}
/* 상단 띠: 지금 띠 바로 아래에 걸린 프로젝트의 배경색으로 바뀜. 없으면 검정 */
function paintBand() {
  root.style.setProperty("--top-h", topBar.offsetHeight + "px");
  const y = topBar.getBoundingClientRect().bottom + 1; let hit = null;
  if (!$("#view-work").hidden) for (const a of $$(".project:not([hidden])")) {

  const c = hit ? hit.dataset.band : "#0c0c0d";
  root.style.setProperty("--band", c);
  let tc = document.querySelector('meta[name="theme-color"]');
  if (!tc) { tc = document.createElement("meta"); tc.name = "theme-color"; document.head.append(tc); }
  if (tc.content !== c) tc.content = c;

}
let bandTick = 0;
const queueBand = () => { if (!bandTick) bandTick = requestAnimationFrame(() => { bandTick = 0; paintBand(); }); };
addEventListener("scroll", queueBand, {passive: true});
addEventListener("resize", queueBand);
/* MAP 네 사분면 한가운데에 2초마다 바뀌는 네 낱말 (왼쪽 위, 오른쪽 위, 왼쪽 아래, 오른쪽 아래 순) */

/* 막대에 올리면 네 사분면의 왼쪽 위 모서리에 각각: 왼쪽 위 연도(크게), 오른쪽 위 사진, 왼쪽 아래 작업 정보, 오른쪽 아래 설명. 뒤에 까는 면 없음 */

/* 이미지 넣기: 1.2MB 이하이고 긴 변 2800px 이하인 JPEG/WebP는 원본 그대로. 그 밖에는 긴 변 2800px, 품질 88의 JPEG로. GIF는 그대로 */
const picker = Object.assign(document.createElement("input"), {type: "file", accept: "image/*,application/pdf", multiple: true}); let pickFor = null;

}
/* PDF: 쪽마다 그림으로 바꿔 슬라이드로 넣음. 변환 도구는 PDF를 처음 넣을 때만 불러옴 */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/", PDF_MAX = 40;

let pdfReady = null;

  pdfReady = pdfReady || loadScript(PDFJS + "pdf.min.js").then(() => loadScript(PDFJS + "pdf.worker.min.js"));   /* 워커 스크립트를 같은 창에 올려 별도 워커 없이 변환 */

  for (let i = 1; i <= n; i++) {

    const page = await doc.getPage(i), v0 = page.getViewport({scale: 1}), vp = page.getViewport({scale: Math.min(4, 2800 / Math.max(v0.width, v0.height))});
    const c = Object.assign(document.createElement("canvas"), {width: Math.round(vp.width), height: Math.round(vp.height)}), g = c.getContext("2d");

picker.addEventListener("change", () => { const files = [...picker.files]; picker.value = ""; addFiles(pickFor, files); });
/* 고른 파일이나 끌어다 놓은 파일을 그 칸에 추가. 이미 사진이 있으면 뒤에 붙어 슬라이드가 됨 */
async function addFiles(d, files) {
  const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  files = files.filter(f => /^image\//.test(f.type) || isPdf(f)); if (!d || !files.length) return;
  const sl = SITE.projects[d.p].rows[d.r][d.s]; let skipped = false, note = "";
  const blobs = [];
  for (const f of files) {
    if (!isPdf(f)) { blobs.push(await shrink(f)); continue; }
    try { const r = await pdfPages(f); blobs.push(...r.pages); if (r.total > r.pages.length) note = L("stPdfCut"); } catch { note = L("stPdfFail"); }
  }
  if (!blobs.length) return status(note || L("stPdfFail"), true);
  sl.items = sl.items || []; delete sl.n;
  for (const blob of blobs) { if (blob.size > 15 * 1048576) { skipped = true; continue; }
    const url = URL.createObjectURL(blob); pending.set(url, blob); sl.items.push({src: url, x: 50, y: 50, z: 1}); }
  touch(); if (skipped) status(L("stGif"), true); else if (note) status(note, true);
  renderAll({key: d.p + "-" + d.r + "-" + d.s, i: sl.items.length - 1});
}

/* 사진에서 색 찍기: 누른 지점이 원본 사진의 어느 픽셀인지 계산해서 그 색을 읽음 */
let picking = null;

function colorAt(img, e) {
  const st = getComputedStyle(img), z = new DOMMatrixReadOnly(st.transform).a || 1, box = img.getBoundingClientRect();
  const w = box.width / z, h = box.height / z, nw = img.naturalWidth, nh = img.naturalHeight, s = st.objectFit === "contain" ? Math.min(w / nw, h / nh) : Math.max(w / nw, h / nh);
  const [px, py] = st.objectPosition.split(" ").map(parseFloat);
  const sx = ((e.clientX - box.left) / z - (w - nw * s) * px / 100) / s, sy = ((e.clientY - box.top) / z - (h - nh * s) * py / 100) / s;

  if (bar) {   /* 위아래 행 사이 막대: 위 행이 커지는 만큼 아래 행이 줄어듦 */
    const rows = SITE.projects[bar.dataset.p].rows, ri = +bar.dataset.r, up = bar.parentElement, dn = bar.dataset.last ? null : up.nextElementSibling;

    bar.setPointerCapture(e.pointerId); e.preventDefault(); return; }

    const dy = clamp(e.clientY - drag.y0, 70 - drag.hu, drag.dn ? drag.hd - 70 : 1600), ru = +(drag.wu / (drag.hu + dy)).toFixed(3);
